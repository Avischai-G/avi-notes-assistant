<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f666d"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9a227"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4ec9a5"/>
    </marker>
    <style>
      .t   { fill:#e8e6e1; font-size:15px; font-weight:600 }
      .s   { fill:#8b9198; font-size:12px }
      .xs  { fill:#5f666d; font-size:11px }
      .lbl { fill:#5f666d; font-size:11px; letter-spacing:1.4px }
      .amb { fill:#c9a227 }
      .grn { fill:#4ec9a5 }
      .box { fill:#16191c; stroke:#2a2f35; stroke-width:1.2; rx:8 }
      .band{ fill:#12151800; stroke:#2a2f35; stroke-width:1; stroke-dasharray:5 5; rx:12 }
      .ln  { stroke:#5f666d; stroke-width:1.4; fill:none; marker-end:url(#a) }
      .lnw { stroke:#c9a227; stroke-width:1.6; fill:none; marker-end:url(#aw) }
      .lng { stroke:#4ec9a5; stroke-width:1.4; fill:none; marker-end:url(#ag); stroke-dasharray:4 4 }
    </style>
  </defs>

  <rect width="1640" height="960" fill="#0f1113"/>

  <text x="48" y="56" class="t" font-size="24">Coroner</text>
  <text x="48" y="82" class="s" font-size="14">Post-mortems for dead multi-agent runs — Gemini 3.5 · Google ADK · Vertex AI · Cloud Run · Firestore</text>

  <!-- ============ BAND 1 : deterministic ingest ============ -->
  <rect x="48" y="120" width="380" height="430" class="band"/>
  <text x="68" y="148" class="lbl">INGEST — NO MODEL INVOLVED</text>

  <rect x="72" y="168" width="332" height="66" class="box"/>
  <text x="90" y="196" class="t" font-size="14">Trace JSON</text>
  <text x="90" y="216" class="xs">whatever the dead run left behind</text>

  <rect x="72" y="262" width="332" height="66" class="box"/>
  <text x="90" y="290" class="t" font-size="14">Adapter to canonical Trace</text>
  <text x="90" y="310" class="xs">the seam: vendor-specific above, neutral below</text>

  <rect x="72" y="356" width="332" height="66" class="box"/>
  <text x="90" y="384" class="t" font-size="14">Redactor</text>
  <text x="90" y="404" class="xs">recognized paths · URLs · credentials are masked</text>

  <rect x="72" y="450" width="332" height="76" class="box"/>
  <text x="90" y="478" class="t" font-size="14">Evidence extractor</text>
  <text x="90" y="498" class="xs">rule-based prior · counts · killing step</text>
  <text x="90" y="516" class="xs">structural counts computed here; model judgment follows</text>

  <path class="ln" d="M238 234 L238 256"/>
  <path class="ln" d="M238 328 L238 350"/>
  <path class="ln" d="M238 422 L238 444"/>

  <!-- ============ BAND 2 : the ADK pipeline ============ -->
  <rect x="470" y="120" width="700" height="620" class="band" stroke="#3a3423"/>
  <text x="490" y="148" class="lbl amb">ADK · SequentialAgent “coroner”</text>

  <rect x="500" y="168" width="640" height="70" class="box" stroke="#3a3423"/>
  <text x="520" y="196" class="t" font-size="14">LlmAgent · <tspan class="amb">triage</tspan></text>
  <text x="520" y="216" class="xs">proposes 2–3 candidate causes — told the rule-based prior is fooled by symptoms</text>

  <rect x="490" y="266" width="660" height="196" class="band" stroke="#2a2f35"/>
  <text x="510" y="292" class="lbl">ParallelAgent · investigation — each told to DESTROY the hypotheses</text>

  <rect x="510" y="308" width="200" height="136" class="box"/>
  <text x="528" y="336" class="t" font-size="13">timeline</text>
  <text x="528" y="358" class="xs">finds the earliest</text>
  <text x="528" y="375" class="xs">divergence; anything</text>
  <text x="528" y="392" class="xs">after it is a symptom,</text>
  <text x="528" y="409" class="xs">not the cause</text>

  <rect x="720" y="308" width="200" height="136" class="box"/>
  <text x="738" y="336" class="t" font-size="13">counterfactual</text>
  <text x="738" y="358" class="xs">remove this cause —</text>
  <text x="738" y="375" class="xs">would the run have</text>
  <text x="738" y="392" class="xs">finished? if not, it</text>
  <text x="738" y="409" class="xs">did not kill it</text>

  <rect x="930" y="308" width="200" height="136" class="box"/>
  <text x="948" y="336" class="t" font-size="13">competing</text>
  <text x="948" y="358" class="xs">builds a rival story</text>
  <text x="948" y="375" class="xs">that fits every</text>
  <text x="948" y="392" class="xs">observation at least</text>
  <text x="948" y="409" class="xs">as well</text>

  <rect x="500" y="500" width="640" height="70" class="box" stroke="#3a3423"/>
  <text x="520" y="528" class="t" font-size="14">LlmAgent · <tspan class="amb">certify</tspan></text>
  <text x="520" y="548" class="xs">a cause survives only a majority of lenses — otherwise UNDETERMINED, not invented</text>

  <rect x="500" y="598" width="640" height="70" class="box" stroke="#21453a"/>
  <text x="520" y="626" class="t" font-size="14">LlmAgent · <tspan class="grn">revive</tspan></text>
  <text x="520" y="646" class="xs">resume plan: restart point · steps to skip · the prompt to hand back</text>

  <text x="490" y="712" class="xs">Typed <tspan fill="#8b9198">output_schema</tspan> on every agent; each stage reads the last one's <tspan fill="#8b9198">output_key</tspan> from session state.</text>

  <path class="ln" d="M404 484 L470 484 L470 203 L494 203"/>
  <path class="ln" d="M820 238 L820 260"/>
  <path class="ln" d="M820 462 L820 494"/>
  <path class="ln" d="M820 570 L820 592"/>

  <!-- ============ BAND 3 : storage + fleet ============ -->
  <rect x="1212" y="120" width="380" height="430" class="band"/>
  <text x="1232" y="148" class="lbl">AGGREGATE</text>

  <rect x="1236" y="168" width="332" height="86" class="box"/>
  <text x="1254" y="196" class="t" font-size="14">Firestore</text>
  <text x="1254" y="216" class="xs">case files · raw traces · sweep state</text>
  <text x="1254" y="236" class="xs">native-mode database “coroner”</text>

  <rect x="1236" y="290" width="332" height="96" class="box"/>
  <text x="1254" y="318" class="t" font-size="14">LlmAgent · <tspan class="amb">prescriber</tspan></text>
  <text x="1254" y="338" class="xs">groups 39 proposed preventions into</text>
  <text x="1254" y="356" class="xs">related orchestrator changes;</text>
  <text x="1254" y="374" class="xs">the grouping is model judgment</text>

  <rect x="1236" y="422" width="332" height="104" class="box" stroke="#3a3423"/>
  <text x="1254" y="450" class="t" font-size="14">Fleet report</text>
  <text x="1254" y="472" class="xs">run IDs validated in Python;</text>
  <text x="1254" y="490" class="xs">group counts and ordering computed</text>
  <text x="1254" y="508" class="xs">after the agent proposes groups</text>

  <path class="ln" d="M1146 633 L1180 633 L1180 211 L1230 211"/>
  <path class="ln" d="M1402 254 L1402 284"/>
  <path class="ln" d="M1402 386 L1402 416"/>

  <!-- ============ watcher ============ -->
  <rect x="470" y="782" width="700" height="94" class="box" stroke="#3a3423"/>
  <text x="496" y="812" class="t" font-size="14"><tspan class="amb">watcher</tspan> — Cloud Scheduler POSTs /api/sweep</text>
  <text x="496" y="834" class="xs">36/39 cases were non-terminal with zero recorded worker failures.</text>
  <text x="496" y="854" class="xs">Any non-terminal run that has not moved for 30 minutes is presumed dead and examined unasked.</text>

  <path class="ln" d="M1402 526 L1402 556"/>
  <path class="lnw" d="M1610 470 L1610 829 L1176 829"/>
  <path class="lnw" d="M470 829 L238 829 L238 532"/>

  <!-- ============ platform ============ -->
  <rect x="48" y="600" width="380" height="276" class="band" stroke="#2e4457"/>
  <text x="68" y="628" class="lbl" fill="#6ea8d8">GOOGLE CLOUD</text>

  <rect x="72" y="648" width="332" height="80" class="box" stroke="#2e4457"/>
  <text x="90" y="676" class="t" font-size="14">Cloud Run</text>
  <text x="90" y="696" class="xs">FastAPI · streams the pipeline as SSE</text>
  <text x="90" y="714" class="xs">so the caller watches six agents work</text>

  <rect x="72" y="756" width="332" height="80" class="box" stroke="#2e4457"/>
  <text x="90" y="784" class="t" font-size="14">Vertex AI</text>
  <text x="90" y="804" class="xs">gemini-3.5-flash, location: global</text>
  <text x="90" y="822" class="xs">every agent in this diagram</text>

  <path class="lng" d="M404 782 L440 782 L440 660 L494 660"/>
  <path class="lng" d="M404 790 L452 790 L452 380 L504 380" opacity="0"/>

  <rect x="1236" y="688" width="332" height="90" class="box" stroke="#21453a"/>
  <text x="1254" y="716" class="t" font-size="14"><tspan class="grn">your orchestrator</tspan></text>
  <text x="1254" y="736" class="xs">POST the resume plan to a URL you set</text>
  <text x="1254" y="754" class="xs">the loop closes without a human: nobody</text>
  <text x="1254" y="770" class="xs">asked for the autopsy or for the restart</text>
  <path class="lng" d="M1146 648 L1200 648 L1200 733 L1230 733"/>

  <rect x="1236" y="562" width="332" height="96" class="box" stroke="#2e4457"/>
  <text x="1254" y="590" class="t" font-size="14">Browser</text>
  <text x="1254" y="610" class="xs">graveyard · case file · fleet report</text>
  <text x="1254" y="628" class="xs">live autopsy, streamed stage by stage</text>
  <text x="1254" y="646" class="xs">no framework, no build step</text>
  <path class="lng" d="M404 688 L436 688 L436 890 L1596 890 L1596 664"/>

  <text x="48" y="926" class="xs">39 owner-authorized production traces · 36/39 silent · mean progress 19.34% over 33 non-aborted runs · certificate differs from regex prior on 8/39</text>
</svg>
