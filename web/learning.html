<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning · Agentonomy Tasks</title>
    <script>(function(){var m=localStorage.getItem('agentonomy-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;})();</script>
    <link rel="stylesheet" href="/learning.css">
</head>
<body>
    <main class="learning-shell">
        <nav class="topline" aria-label="Learning navigation">
            <a href="/" class="back-link">Chat</a>
            <span id="timezone-label" class="timezone-label" aria-live="polite"></span>
        </nav>

        <header class="intro">
            <h1>Learning</h1>
            <p>What your organiser has learned while organising your work. The detailed log stays with the agent.</p>
        </header>

        <div class="period-switch" role="group" aria-label="Learning period">
            <button type="button" data-period="day" aria-pressed="true">Day</button>
            <button type="button" data-period="week" aria-pressed="false">Week</button>
            <button type="button" data-period="month" aria-pressed="false">Month</button>
        </div>

        <section id="learning-content" aria-live="polite" aria-busy="true">
            <p class="loading">Reading what changed…</p>
        </section>
    </main>
    <script src="/learning.js" defer></script>
</body>
</html>
