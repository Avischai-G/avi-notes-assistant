<!doctype html>
<html lang="en" data-theme="dark" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Agentonomy Tasks</title>
  <script>(function(){var m=localStorage.getItem('agentonomy-theme')||'system';var d=document.documentElement;d.dataset.themeMode=m;d.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m;})();</script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="menu" type="button" aria-label="Channels" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
    <span class="wordmark">Agentonomy Tasks</span>
    <button class="icon-button" id="theme" type="button" aria-label="Theme: follow system">
      <svg class="mode-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="mode-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="mode-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
  </header>

  <dialog class="drawer" id="drawer" aria-label="Channels">
    <nav class="channels custom-scrollbar" aria-label="Channels">
      <a class="channel" id="channel-chat" href="#chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 20.5l1.5-4.7A8.4 8.4 0 0 1 3.6 12a8.4 8.4 0 0 1 8.4-8.4h.5A8.4 8.4 0 0 1 21 11.5Z"/></svg>
        <span>Chat</span>
      </a>
      <div id="automation-channels"></div>
      <a class="channel" href="/learning">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <span>Learning</span>
      </a>
    </nav>
    <a class="channel drawer-foot" id="channel-settings" href="#settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span>Settings</span>
    </a>
  </dialog>

  <main class="pane chat-pane" id="chat-pane">
    <section class="transcript custom-scrollbar" id="transcript" aria-live="polite"></section>
    <div class="composer-dock">
      <div class="composer-shell" id="composer-shell">
        <div class="attachment-chips" id="attachment-chips"></div>
        <div class="composer-row" id="composer-grid" data-expanded="false">
          <button class="attach-button" id="attach" type="button" aria-label="Attach a file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg>
          </button>
          <textarea class="composer-input custom-scrollbar" id="input" rows="1" maxlength="12000" placeholder="Ask anything" aria-label="Message Agentonomy Tasks"></textarea>
          <button class="live-toggle" id="live-toggle" type="button" aria-label="Start live conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4"/></svg>
          </button>
          <button class="send-button" id="send" type="button" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg>
          </button>
        </div>
      </div>
      <input id="file-input" type="file" accept="image/*,application/pdf" multiple hidden>
    </div>
  </main>

  <main class="pane settings-pane custom-scrollbar" id="settings-pane" hidden>
    <div class="settings-inner">
      <section class="setting">
        <h2 id="prompt-label">Chat instructions</h2>
        <p class="hint">How the assistant behaves in your main chat.</p>
        <textarea class="field custom-scrollbar" id="system-prompt" rows="12" aria-labelledby="prompt-label"></textarea>
      </section>
      <section class="setting">
        <div class="setting-head">
          <div>
            <h2>Automations</h2>
            <p class="hint">A prompt, and when it runs.</p>
          </div>
          <button class="icon-button" id="add-automation" type="button" aria-label="New automation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="automation-editors"></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="live-fx.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
