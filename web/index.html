<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Avi's notes</title>
  <script>(function(){var t=localStorage.getItem('agentonomy-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <nav class="product-nav" aria-label="Product navigation">
      <div class="nav-brand">
        <span class="nav-kicker">Assistant</span>
        <span class="nav-title">Avi's notes</span>
      </div>
      <div class="nav-links">
        <a class="nav-task-chat active" id="nav-task-chat" href="#task-chat">Task chat</a>
        <a class="nav-life-chat" id="nav-life-chat" href="#life-chat">Life chat</a>
        <a class="nav-learning" href="/learning">Learning</a>
        <div id="automation-nav"></div>
      </div>
      <button class="theme-button" id="theme" type="button" aria-label="Toggle theme">◐</button>
    </nav>
    <main class="chat-pane">
      <header class="surface-header" id="surface-header" hidden>
        <div>
          <h1 id="surface-title"></h1>
          <p id="surface-schedule"></p>
        </div>
        <button class="run-button" id="run-now" type="button">Run now</button>
      </header>
      <section class="transcript custom-scrollbar" id="transcript" aria-live="polite"></section>
      <div class="composer-dock">
        <div class="composer-shell" id="composer-shell">
          <div class="attachment-chips" id="attachment-chips"></div>
          <div class="composer-row" id="composer-grid" data-expanded="false">
            <button class="attach-button" id="attach" type="button" aria-label="Attach a file">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"/></svg>
            </button>
            <textarea class="composer-input custom-scrollbar" id="input" rows="1" maxlength="12000" placeholder="Ask anything" aria-label="Message Avi's assistant"></textarea>
            <button class="send-button" id="send" type="button" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="m12 13 7-8"/></svg>
            </button>
          </div>
        </div>
        <input id="file-input" type="file" multiple hidden>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
